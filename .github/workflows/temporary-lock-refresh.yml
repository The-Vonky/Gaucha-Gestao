name: Temporary reproducible npm lockfile refresh
on:
  push:
    branches: [fix/ci-minimatch-audit-20261103]
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile installs before committing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert patched minimatch versions
        shell: bash
        run: |
          npm ls minimatch
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package-lock.json","utf8")); for(const [k,v] of Object.entries(p.packages)){if(k.endsWith("node_modules/minimatch") && v.version!=="11.0.3") throw new Error(k+": "+v.version)}'
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate validated npm lockfile"
          git push origin HEAD:fix/ci-minimatch-audit-20261103
