# Reduced official self-hosted/v0.8.1 routes; see UPSTREAM.md.
_format_version: '2.1'
_transform: true
consumers:
- username: anon
  keyauth_credentials:
  - key: $SUPABASE_ANON_KEY
- username: service_role
  keyauth_credentials:
  - key: $SUPABASE_SERVICE_KEY
acls:
- consumer: anon
  group: anon
- consumer: service_role
  group: admin
services:
- name: auth-v1-open
  _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
  url: http://auth:9999/verify
  routes:
  - name: auth-v1-open
    strip_path: true
    paths:
    - /auth/v1/verify
  plugins:
  - name: cors
- name: auth-v1-open-callback
  _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
  url: http://auth:9999/callback
  routes:
  - name: auth-v1-open-callback
    strip_path: true
    paths:
    - /auth/v1/callback
  plugins:
  - name: cors
- name: auth-v1-open-authorize
  _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
  url: http://auth:9999/authorize
  routes:
  - name: auth-v1-open-authorize
    strip_path: true
    paths:
    - /auth/v1/authorize
  plugins:
  - name: cors
- name: auth-v1-open-jwks
  _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
  url: http://auth:9999/.well-known/jwks.json
  routes:
  - name: auth-v1-open-jwks
    strip_path: true
    paths:
    - /auth/v1/.well-known/jwks.json
  plugins:
  - name: cors
- name: auth-v1-open-sso-acs
  url: http://auth:9999/sso/saml/acs
  routes:
  - name: auth-v1-open-sso-acs
    strip_path: true
    paths:
    - /auth/v1/sso/saml/acs
  plugins:
  - name: cors
- name: auth-v1-open-sso-metadata
  url: http://auth:9999/sso/saml/metadata
  routes:
  - name: auth-v1-open-sso-metadata
    strip_path: true
    paths:
    - /auth/v1/sso/saml/metadata
  plugins:
  - name: cors
- name: auth-v1
  _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
  url: http://auth:9999/
  routes:
  - name: auth-v1-all
    strip_path: true
    paths:
    - /auth/v1/
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
      replace:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: rest-v1-openapi
  _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
  url: http://rest:3000/
  routes:
  - name: rest-v1-openapi-root
    strip_path: true
    expression: http.path == "/rest/v1/"
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
      replace:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
- name: rest-v1
  _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
  url: http://rest:3000/
  routes:
  - name: rest-v1-all
    strip_path: true
    paths:
    - /rest/v1/
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
      replace:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: graphql-v1
  _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
  url: http://rest:3000/rpc/graphql
  routes:
  - name: graphql-v1-all
    strip_path: true
    paths:
    - /graphql/v1
  plugins:
  - name: cors
  - name: key-auth
    config:
      hide_credentials: false
  - name: request-transformer
    config:
      add:
        headers:
        - 'Content-Profile: graphql_public'
        - 'Authorization: $LUA_AUTH_EXPR'
      replace:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
  - name: acl
    config:
      hide_groups_header: true
      allow:
      - admin
      - anon
- name: storage-v1
  _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
  url: http://storage:5000/
  routes:
  - name: storage-v1-all
    strip_path: true
    paths:
    - /storage/v1/
  plugins:
  - name: cors
  - name: request-transformer
    config:
      add:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
      replace:
        headers:
        - 'Authorization: $LUA_AUTH_EXPR'
  - name: post-function
    config:
      access:
      - "local auth = kong.request.get_header(\"authorization\")\nif auth == nil or auth == \"\" or auth:find(\"^%s*$\") then\n\
        \  kong.service.request.clear_header(\"authorization\")\nend\n"
- name: well-known-oauth
  _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
  url: http://auth:9999/.well-known/oauth-authorization-server
  routes:
  - name: well-known-oauth
    strip_path: true
    paths:
    - /.well-known/oauth-authorization-server
  plugins:
  - name: cors
