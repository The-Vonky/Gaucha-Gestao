name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Decoder AUD-IMG-02: namespaces sem rede; sem fallback sem isolamento.
      - name: Dependência de isolamento dos testes de imagem
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm test
      # Fictitious public values so the real application is bundled.
      # Not credentials: nothing is contacted during build and no deploy happens.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-build-placeholder
      - run: npm run verify:build
      # Security gate covers production and development dependencies (including CI/test tools).
      # The PR #35 upgrade eliminated the previous 4 findings; fail on moderate or worse.
      - run: npm audit --audit-level=moderate
  sales-integration:
    strategy:
      matrix:
        suite: [operations, analytics, units, export]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ven02-synthetic-ci
          POSTGRES_DB: gaucha_sales_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaucha_sales_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SALES_CI_DATABASE_URL: postgresql://postgres:ven02-synthetic-ci@127.0.0.1:5432/gaucha_sales_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Executa a mesma matriz de RPC/grants/RLS no PostgreSQL vazio deste job.
      - run: npx vitest run tests/sales-${{ matrix.suite }}-database.test.ts
      # Sessões independentes observam pg_blocking_pids, sem mocks de concorrência.
      - if: matrix.suite == 'operations'
        run: node tests/integration/sales-concurrency.mjs
  action-plans-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Aplicação/writer/download reais com transporte interceptado, sem banco.
      - run: node tests/integration/sales-export-browser.mjs
      # Disposable local services only; no linked project or deployment credentials.
      # Storage API is required by the evidence suite; imgproxy stays excluded.
      - run: npx --yes supabase@2.117.0 start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: node tests/integration/action-plans.mjs
      - run: node tests/integration/evidence.mjs
      - run: node tests/integration/reporting.mjs
      - run: node tests/integration/audit.mjs
      # Checklist Evidence: real Storage bytes, two-session PostgreSQL races, desktop/375px.
      - run: node tests/integration/audit-evidence.mjs
      # Unit Cover v1: real Auth/Storage upload, batch signing, bucket limits and denials.
      - run: node tests/integration/unit-cover.mjs
      # Curva ABC v1: real Auth/Storage upload, RLS by unit, concurrent publishers and log.
      - run: node tests/integration/abc.mjs
      # Core Reference Resolvers v1: real JWTs/PostgREST, denials, guessed IDs and batch limit.
      - run: node tests/integration/core-references.mjs
      # Core governance and logs: real JWT/PostgREST negative authorization matrix.
      - run: node tests/integration/core-security-matrix.mjs
      # VEN-05A: JWT/PostgREST, paginação, concorrência e download XLSX real.
      - run: node tests/integration/sales-export.mjs
      # Admin UI at 375/768/1024/1440; adds uniquely tagged rows only, so it runs last.
      - run: node tests/integration/admin.mjs
      - if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
