# Temporary, isolated evidence for issue #34; no deploy, migrations or secrets.
name: Core v2 dependency triage
on:
  push:
    branches:
      - audit/core-v2-dependency-triage-v1
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full and production-only audit
        shell: bash
        run: |
          npm audit --json > full-audit.json || true
          npm audit --omit=dev --json > production-audit.json || true
          node --input-type=commonjs - <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['ALL', 'full-audit.json'], ['PRODUCTION', 'production-audit.json']]) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log('AUDIT_SUMMARY', label, JSON.stringify(data.metadata?.vulnerabilities ?? {}));
            for (const [name, v] of Object.entries(data.vulnerabilities || {})) {
              console.log('AUDIT_FINDING', JSON.stringify({
                audit: label, name, severity: v.severity, isDirect: v.isDirect,
                range: v.range, fixAvailable: v.fixAvailable, effects: v.effects,
                via: v.via.map(x => typeof x === 'string'
                  ? x
                  : { name: x.name, title: x.title, url: x.url, range: x.range, severity: x.severity })
              }));
            }
            if (data.error) console.log('AUDIT_ERROR', JSON.stringify(data.error));
          }
          NODE
      - name: Upload reports for review
        uses: actions/upload-artifact@v4
        with:
          name: core-v2-npm-audit
          path: |
            full-audit.json
            production-audit.json
          retention-days: 7
  migration-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Try safe dependency upgrade without committing it
        run: |
          npm install --save-dev --save-exact vitest@5.0.4
          npm audit fix --no-fund
          npm audit --audit-level=moderate
          npm ls vitest @vitest/mocker tinypool source-map-js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-build-placeholder
      - run: npm run verify:build
      - name: Capture verified manifests for isolated commit
        uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 3
  persist-tested-dependencies:
    needs: migration-probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core-v2-dependency-triage-v1
      - uses: actions/download-artifact@v4
        with:
          name: verified-dependency-manifests
      - name: Commit only reviewed dependency manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "fix(dev): upgrade Vitest and patch vulnerable transitive dependencies"
          git push origin HEAD:refs/heads/audit/core-v2-dependency-triage-v1
